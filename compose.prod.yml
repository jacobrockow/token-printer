services:
  backend:
    build:
      context: ./backend
    container_name: token_printer_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRYFALL_USER_AGENT: ${SCRYFALL_USER_AGENT:-token-printer-webapp/0.1}
      PRINTER_HOST: ${PRINTER_HOST:?Set PRINTER_HOST in .env}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
      PRINTER_WIDTH: ${PRINTER_WIDTH:-576}
    volumes:
      - generated:/app/app/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: token_printer_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  generated:
