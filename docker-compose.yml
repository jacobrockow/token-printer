services:
  backend:
    build:
      context: ./backend
    container_name: token_printer_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    network_mode: host
    volumes:
      - ./backend:/app
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      LOG_LEVEL: INFO
      SCRYFALL_USER_AGENT: token-printer-webapp/0.1
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
      PRINTER_WIDTH: ${PRINTER_WIDTH:-576}
      THERMAL_BRIGHTNESS_NORMAL: ${THERMAL_BRIGHTNESS_NORMAL:-1.10}
      THERMAL_BRIGHTNESS_DARK: ${THERMAL_BRIGHTNESS_DARK:-1.20}

  frontend:
    build:
      context: ./frontend
    container_name: token_printer_frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    network_mode: host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
